<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>NUEZMAR — Tu recomendación</title>
<style>
  :root{
    --vino: #763332;
    --rosa: #C1757A;
    --amarillo: #F5E2A8;
    --crema: #FBF3E4;
    --vino-oscuro: #4a1f1e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--vino);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color:var(--vino-oscuro);
    display:flex;
    justify-content:center;
  }

  .page{
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .brand-banner{
    width:100%;
    display:block;
  }

  .content{
    width:100%;
    padding:24px 30px 44px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  /* la nuez-corazón real, cortada al medio, que se separa */
  .nut-wrap{
    width:150px;
    aspect-ratio: 616 / 750;
    margin-bottom:16px;
    cursor:pointer;
    -webkit-user-select:none;
    user-select:none;
    display:flex;
  }
  .nut-half{
    width:50%;
    height:100%;
    overflow:visible;
    transition: transform 0.6s cubic-bezier(.34,1.56,.64,1);
  }
  .nut-half img{
    width:100%;
    height:100%;
    display:block;
    object-fit:fill;
    pointer-events:none;
  }
  .nut-wrap:active .nut-half{ transform: scale(0.96); }
  .page.open .nut-left{ transform: translateX(-16px) rotate(-9deg); }
  .page.open .nut-right{ transform: translateX(16px) rotate(9deg); }

  .prompt{
    font-size:1rem;
    letter-spacing:0.03em;
    color:var(--amarillo);
    margin:0 0 6px;
    font-weight:600;
    transition: opacity 0.3s ease;
  }
  .page.open .prompt{ opacity:0; height:0; margin:0; overflow:hidden; }

  .card{
    background:var(--crema);
    color:var(--vino-oscuro);
    border-radius:18px;
    padding:0;
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition: max-height 0.6s ease, opacity 0.5s ease 0.1s, padding 0.6s ease, margin 0.6s ease;
    width:100%;
    box-shadow: 0 14px 34px rgba(0,0,0,0.28);
  }
  .page.open .card{
    max-height:400px;
    opacity:1;
    padding:26px 22px 22px;
    margin-top:2px;
  }
  .card-eyebrow{
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:var(--rosa);
    font-weight:700;
    margin-bottom:12px;
  }
  .card-phrase{
    font-family: Georgia, 'Times New Roman', serif;
    font-weight:600;
    font-size:1.3rem;
    line-height:1.35;
    margin:0 0 16px;
  }
  .card-phrase::before{ content:'\201C'; }
  .card-phrase::after{ content:'\201D'; }

  .cta-wrap{
    margin-top:26px;
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .cta-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:15px 18px;
    border-radius:100px;
    font-size:0.98rem;
    font-weight:700;
    text-decoration:none;
    line-height:1;
    box-shadow: 0 10px 22px rgba(0,0,0,0.22);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .cta-btn:active{ transform: scale(0.97); }
  .cta-btn svg{ flex-shrink:0; }

  .cta-instagram,
  .cta-whatsapp{
    background:var(--amarillo);
    color:var(--vino-oscuro);
  }

  @media (prefers-reduced-motion: reduce){
    .nut-half{ transition:none; }
  }
</style>
</head>

<script>
  // ✏️ EDITÁ ACÁ TU LISTA REAL DE RECOMENDACIONES — una por línea, entre comillas, separadas por coma.
  const RECOMENDACIONES = [
    "No era hambre. Era una situación que requería torta.",
    "Alguien te va a invitar a tomar mate. Llevá algo.",
    "Compartir es importante. La última porción, no tanto.",
    "Tu amig@ dijo que iba a comer poquito. No le creas.",
    "Hay decisiones que no necesitan pensarse tanto. Como repetir porción.",
    "Si dijiste 'solo una porción', no vamos a juzgarte.",
    "Hay gente que cree en las señales. Nosotros creemos en cortar otra porción.",
    "Decir 'una más y listo' nunca significó 'una más y listo'.",
    "Hay cosas que se comparten. La última porción se negocia.",
    "¿Querés? es una pregunta peligrosa cuando queda una sola.",
    "Consultamos al universo. Dijo que cortes otra porción.",
    "El horóscopo dice que compartas. Pero no especificó cuánto.",
    "No podemos resolver todos tus problemas. Pero podemos cortar una porción.",
    "El destino es incierto. La torta, por suerte, no.",
    "Un amigo de verdad te deja la última porción. Uno excelente te la ofrece y espera que digas que no.",
    "El día fue largo. La sobremesa puede serlo también.",
    "Café, algo dulce y cinco minutos más. A veces alcanza.",
    "A veces no necesitás un plan. Necesitás una NUEZMAR.",
    "Tu futuro tiene nueces. Tu presente también debería.",
    "Mercurio está retrógrado. Pero la torta está perfecta.",
    "No somos expertos en astrología. Pero sabemos que sos de repetir.",
    "Según nuestros cálculos, hoy necesitás torta.",
    "Manifestá cosas lindas. Como una sobremesa larga.",
    "Tu energía pide descanso. Tu merienda pide NUEZMAR.",
    "Hoy el universo está alineado. Sobre todo con la bandeja."
  ];

  const page = document.getElementById('page');
  const nutWrap = document.getElementById('nutWrap');
  const phraseText = document.getElementById('phraseText');

  // ---- Persistencia diaria por dispositivo ----
  // La idea: cada dispositivo (celular) que entra un día determinado, siempre
  // recibe la misma recomendación ese día, sin importar cuántas veces toque
  // la nuez, cierre la página o recargue. Al otro día, se le asigna una
  // nueva al azar. Dos dispositivos distintos el mismo día pueden recibir
  // recomendaciones distintas, porque cada uno guarda su propio dato en su
  // localStorage.
  const STORAGE_KEY = 'nuezmar_recomendacion_dia';

  function todayStr(){
    const d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }

  function getStoredIndex(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      const data = JSON.parse(raw);
      if(data && data.date === todayStr() && typeof data.index === 'number' && data.index >= 0 && data.index < RECOMENDACIONES.length){
        return data.index;
      }
    }catch(e){ /* localStorage no disponible: seguimos sin persistencia */ }
    return null;
  }

  function saveIndex(index){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ date: todayStr(), index: index }));
    }catch(e){ /* si falla, no pasa nada grave: simplemente no persiste */ }
  }

  function pickRandomIndex(){
    return Math.floor(Math.random() * RECOMENDACIONES.length);
  }

  // Siempre se usa (o se genera y guarda, si es la primera vez en el día) la
  // recomendación "oficial" del día para este dispositivo. No hay forma de
  // ver otra tocando de nuevo: es siempre la misma hasta el otro día.
  function reveal(){
    let index = getStoredIndex();
    if(index === null){
      index = pickRandomIndex();
      saveIndex(index);
    }
    phraseText.textContent = RECOMENDACIONES[index];
    page.classList.add('open');
  }

  nutWrap.addEventListener('click', reveal);
  nutWrap.addEventListener('keypress', (e) => { if(e.key === 'Enter' || e.key === ' ') reveal(); });
</script>
